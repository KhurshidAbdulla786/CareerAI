version: '3.8'

services:
  # MongoDB
  mongodb:
    image: mongo:7
    container_name: careerai-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: careerai
    volumes:
      - mongodb_data:/data/db
      - ./backend/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro

  # Backend (Node.js + Express)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careerai-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://admin:password123@mongodb:27017/careerai?authSource=admin
      - JWT_SECRET=careerai_jwt_secret_key_change_in_production
      - JWT_EXPIRES_IN=7d
      - AI_SERVICE_URL=http://ai-service:8000
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
    depends_on:
      - mongodb
      - ai-service
    volumes:
      - backend_uploads:/app/uploads

  # AI Service (Python FastAPI)
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: careerai-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - HOST=0.0.0.0
      - PORT=8000
      - LLM_PROVIDER=groq
      - USE_MOCK_LLM=false
      - GROQ_API_KEY=${GROQ_API_KEY:-gsk_your_groq_api_key}
      - GROQ_MODEL=llama-3.3-70b-versatile
      - CORS_ORIGINS=http://localhost:5173,http://localhost:5000
      - BACKEND_API_URL=http://backend:5000/api
    volumes:
      - chromadb_data:/app/data/chromadb
      - vector_store_data:/app/data/vector_store

  # Frontend (React + Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: careerai-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=http://localhost:5000/api
      - VITE_AI_SERVICE_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  mongodb_data:
  backend_uploads:
  chromadb_data:
  vector_store_data: